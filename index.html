<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prüfsinn</title>
  <meta name="description" content="Prüfsinn – Werkzeugkasten für Prüfingenieure: Mängel einsprechen, amtliche Einstufung sehen, StVZO durchsuchen, rechnen. Funktioniert offline.">
  <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prüfsinn">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <style>
    /* Hintergrund sofort setzen, damit die Seite beim Laden nicht weiß aufblitzt */
    html { background: #f2efe9; }
    @media (prefers-color-scheme: dark) { html { background: #121110; } }
    html[data-theme="light"] { background: #f2efe9; }
    html[data-theme="dark"] { background: #121110; }
    /* Zeichen und Name, bis die App geladen ist (wird beim Start ersetzt) */
    .vorab { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px;
      font: 500 1.15rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -.02em; color: #1b1a18; }
    .vorab img { border-radius: 16px; }
    @media (prefers-color-scheme: dark) { .vorab { color: #f3efe8; } }
    html[data-theme="light"] .vorab { color: #1b1a18; }
    html[data-theme="dark"] .vorab { color: #f3efe8; }
  </style>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Darstellung vor dem ersten Zeichnen setzen (kein Aufblitzen)
    try { var t = (JSON.parse(localStorage.getItem('pk.einstellungen') || '{}')).theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="vorab" aria-hidden="true"><img src="assets/icon.svg" width="64" height="64" alt=""><span>Prüfsinn</span></div>
    <noscript><p style="padding:24px;font-family:sans-serif">Prüfsinn braucht JavaScript. Bitte im Browser aktivieren.</p></noscript>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
